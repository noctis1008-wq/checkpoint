name: Release scripts

# Publishes dropbox.c (and its guide) as a GitHub release on every push to the
# dropbox-sync branch, so it can be downloaded on its own:
#   https://github.com/<owner>/checkpoint/releases/latest/download/dropbox.c
on:
  push:
    branches: [dropbox-sync]
    paths:
      - scripts/common/universal/dropbox.c
      - scripts/common/universal/c_github_downloader.c
      - scripts/3ds/universal/update_reffix.c
      - scripts/dropbox.md
      - .github/workflows/release-scripts.yml

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse-check the script
        run: |
          git submodule update --init --depth 1 3rd-party/picoc
          bash tools/scriptlint.sh scripts/common/universal/dropbox.c scripts/common/universal/c_github_downloader.c scripts/3ds/universal/update_reffix.c scripts/3ds/universal/update_reffix.c

      - name: Old file name for older downloaders' self-update
        run: cp scripts/common/universal/c_github_downloader.c github_downloader.c

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dropbox-${{ github.run_number }}
          name: Dropbox sync + GitHub downloader scripts (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            scripts/common/universal/dropbox.c
            scripts/common/universal/c_github_downloader.c
            github_downloader.c
            scripts/3ds/universal/update_reffix.c
            scripts/dropbox.md
          body: |
            Copy dropbox.c and/or c_github_downloader.c to SD:/3ds/Checkpoint/scripts/universal/ (Switch: SD:/switch/Checkpoint/scripts/universal/). Needs Checkpoint 5.0 or newer.
            update_reffix.c (3DS) updates GodMode9_RefFix.firm in /luma/payloads/ in one go, keeping a hotkey name such as x_GodMode9_RefFix.firm.
            c_github_downloader.c (named so it is second in the Scripts list; github_downloader.c is the same file under its old name, for older copies updating themselves) downloads (and updates) dropbox.c, GodMode9_RefFix.firm and files from any public GitHub release, straight from the console.
            Setup guide: dropbox.md
            Always-current download: https://github.com/${{ github.repository }}/releases/latest/download/dropbox.c
